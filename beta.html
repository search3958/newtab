<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaeTab 7</title>
<link rel="icon" href="https://search3958.github.io/project/logos/saetab_main.webp" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wdth@12..36,110&display=swap" rel="stylesheet"><style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: #fff var(--wallpaper-light, url("bgimg/baram1.webp"))
        center / cover no-repeat fixed;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    padding: 0;
    margin: 0;
    transition: background-image 0.3s ease;
    background-attachment: fixed;
    background-size: cover;
    background-position: center;
    overflow-x: hidden;
}

body::after{
    content:" ";
    background: linear-gradient(0deg, rgba(0, 0, 0, 67%) 0%, rgba(0, 0, 0, 42%) 23%, rgba(0, 0, 0, 15%) 38%, rgba(0, 0, 0, 0%) 55%);
    height:600px;
    width:100vw;
    position:fixed;
    bottom:0;
    left:0;
    z-index:-1;
}

@media (prefers-color-scheme: dark) {
    body {
        background-color: #000;
        background-image: var(--wallpaper-dark, url("bgimg/baram1_dark.webp"));
    }
}

#clock {
    position: fixed;
    bottom: 130px;
    right: 0px;
    color: #fff;
    font-size: 48px;
    width:100vw;
    text-align:center;
  font-family: "TikTok Sans", sans-serif;
}


.search {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 450px;
    background: #fff;
    border-radius: 99px;
    padding: 8px;
    position: fixed;
    display: flex;
    flex-wrap: nowrap;
}
#searchBox {
    margin: 0;
    width: 100%;
    height: 44px;
    font-size: 24px;
    padding-left: 16px;
    border: none;
    background: none;
    outline: none;
    border-radius: 100px;
    font-family: inherit;
}

.searchbtn {
    margin: 0;
    width: 60px;
    height: 44px;
    border: none;
    background:#000;
    border-radius: 100px;
    cursor: pointer;
}

/* ================================
   History (v2.1 style)
   ================================ */

.history-list {
    position: fixed;
    top: 140px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 4px;
    z-index: 100;
    max-width: 500px;
}

.history {
    position: relative;
    margin: 4px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.5);
    color: #000;
    border-radius: 16px;
    backdrop-filter: blur(16px);
    height: 24px;
    font-size: 14px;
    cursor: pointer;
}

@media (prefers-color-scheme: dark) {
    .history {
        background: rgba(28, 28, 28, 0.5);
        color: #fff;
    }
}

.app-search-buttons {
    position: fixed;
    bottom: 90px;
    left: 0px;
    width:100vw;
    display: flex;
    gap: 4px;
    justify-content: center;
}

.search-btn {
    margin: 4px;
    padding: 8px 16px;
    background: var(--b);
    color: #000;
    font-weight: 600;
    border-radius: 99px;
    height: 40px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding-left: 12px;
}


.app-search-dropdown,#mainSuggestionDropdown {
    position: fixed;
    bottom: 145px;
    left: 50%;
    transform: translateX(-50%);
    width: 413px;
    max-height: 300px;
    overflow-y: auto;
    background: #fffd;
    border-radius: 35px;
    backdrop-filter: blur(24px);
    z-index: 1;
    padding: 8px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    display: none;
    corner-shape: superellipse(1.6);
}

@media (prefers-color-scheme: dark) {
    .app-search-dropdown {
        background: #000d;
    }
}

.app-search-dropdown.visible {
    display: block;
}

.app-search-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 99px;
    cursor: pointer;
    transition: background 0.15s ease;
    corner-shape: superellipse(1.6);
}

.app-search-item:hover {
    background: rgba(153, 153, 153, 0.14);
}

@media (prefers-color-scheme: dark) {
    .app-search-item:hover {
        background: rgba(24, 90, 242, 0.2);
    }
}

.app-search-item-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.app-search-item-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.app-search-item-name {
    font-size: 14px;
    color: #000;
}

@media (prefers-color-scheme: dark) {
    .app-search-item-name {
        color: #fff;
    }
}

.app-search-item-url {
    display:none
}

/* ================================
    Intelligence Box
    ================================ */

.intelligence-box {
    position: fixed;
    top: 130px;
    left: 50%;
    transform: translateX(-50%);
    width: 413px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 16px;
    backdrop-filter: blur(24px);
    z-index: 150;
    padding: 8px 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.3s ease, transform 0.3s ease;
    opacity: 0;
    transform: translateX(-50%) translateY(-10px);
    pointer-events: none;
}

@media (prefers-color-scheme: dark) {
    .intelligence-box {
        background: rgba(28, 28, 28, 0.95);
    }
}

.intelligence-box.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
}

.intelligence-answer {
    font-size: 16px;
    color: #000;
    text-align: center;
    width: 100%;
    cursor: pointer;
}

@media (prefers-color-scheme: dark) {
    .intelligence-answer {
        color: #fff;
    }
}

.intelligence-answer.hide {
    color: #0059ff;
    filter: blur(4px);
    opacity: 0;
}

/* ================================
   Shortcut Section (scrolls into view)
   ================================ */

.shortcut {
    position: relative;
    top: 100vh;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(32px);
    padding-top: 8px;
    min-height: 100vh;
    width: 100%;
    z-index: 1;
}

@media (prefers-color-scheme: dark) {
    .shortcut {
        background: rgba(0, 0, 0, 0.3);
    }
}

.main-shortcuts {
    box-sizing: border-box;
    padding: 32px;
}

.main-shortcuts-list {
    display: flex;
    flex-direction: column;
    gap: 28px;
    max-width: 1100px;
    margin: 0 auto;
}

.main-shortcut-category {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.main-shortcut-title {
    margin: 0;
    font-size: 20px;
    text-align: center;
    font-weight:400;
    color: #000;
    margin-top:16px;
}

@media (prefers-color-scheme: dark) {
    .main-shortcut-title {
        color: #fff;
    }
}

.main-shortcut-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 4px;
}

/* ================================
    Shortcut Items (v2.1 style)
   ================================ */

.main-shortcut-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    min-width: 40px;
    color: inherit;
    text-decoration: none;
    perspective: 800px;
}

.main-shortcut-box {
    border-radius: 40px;
    background-color: rgba(255, 255, 255, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease-out;
    transform: rotateX(0deg) rotateY(0deg);
    overflow: hidden;
}

@media (prefers-color-scheme: dark) {
    .main-shortcut-box {
        background-color: rgba(17, 17, 17, 0.7);
    }
}

.main-shortcut-icon {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
}

.main-shortcut-icon img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    scale:0.9;
}

.main-shortcut-name {
    width: 70px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
    font-size: 12px;
    line-height: 1.3;
    color: rgba(0, 0, 0, 0.88);
}

@media (prefers-color-scheme: dark) {
    .main-shortcut-name {
        color: rgba(255, 255, 255, 0.92);
    }
}

.main-shortcut-box {
    transition: transform 0.2s ease-out;
}

.main-shortcut-item:hover .main-shortcut-box {
    transform: rotateX(0deg) rotateY(0deg);
}

/* ================================
    Shared Dialog / Settings
    ================================ */

.newtab-dialog {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.38);
    opacity: 0;
    transition: opacity 0.16s ease;
}

.newtab-dialog.is-open {
    opacity: 1;
}

.newtab-dialog.is-closing {
    opacity: 0;
}

.newtab-dialog[hidden] {
    display: none;
}

.newtab-dialog-content {
    width: min(520px, 100%);
    max-height: min(82vh, 760px);
    overflow-y: auto;
    position: relative;
    box-sizing: border-box;
    padding: 16px;
    border-radius: 48px;
        corner-shape: superellipse(1.6);
    background: #fff;
    color: #111;
    box-shadow: 0 14px 80px #000a;
    transform: scale(0.96);
    opacity: 0;
    transition: transform 0.16s ease, opacity 0.16s ease;
}

.newtab-dialog.is-open .newtab-dialog-content {
    transform: scale(1);
    opacity: 1;
}

.newtab-dialog.is-closing .newtab-dialog-content {
    transform: scale(0.96);
    opacity: 0;
}

@media (prefers-color-scheme: dark) {
    .newtab-dialog-content {
        background: rgba(28, 28, 28, 0.97);
        color: #fff;
    }
}

.newtab-dialog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
}

.newtab-dialog-title {
    margin: 0;
    font-size: 32px;
    font-weight: 400;
}

.newtab-dialog-close {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.06);
    color: inherit;
    font: inherit;
    font-size: 22px;
    padding-bottom: 5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, transform 0.12s ease;
}

.newtab-dialog-close:hover {
    background: rgba(0, 0, 0, 0.1);
}

.newtab-dialog-close:active {
    transform: scale(0.94);
}

@media (prefers-color-scheme: dark) {
    .newtab-dialog-close {
        background: rgba(255, 255, 255, 0.08);
    }

    .newtab-dialog-close:hover {
        background: rgba(255, 255, 255, 0.13);
    }
}

.newtab-dialog-content .dialog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
}

.newtab-dialog-content .dialog-header h3 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
}

.newtab-dialog-content .dialog-empty {
    margin: 8px 0 0;
    text-align: center;
    color: #888;
}

.newtab-dialog-content > ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.newtab-dialog-content > ul > li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 4px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    cursor: pointer;
    font-size: 14px;
}

.newtab-dialog-content > ul > li:last-child {
    border-bottom: 0;
}

.newtab-dialog-content > ul > li:hover {
    background: rgba(0, 0, 0, 0.04);
}

@media (prefers-color-scheme: dark) {
    .newtab-dialog-content > ul > li {
        border-bottom-color: rgba(255, 255, 255, 0.1);
    }

    .newtab-dialog-content > ul > li:hover {
        background: rgba(255, 255, 255, 0.05);
    }
}

.newtab-settings-section {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 18px;
}

.newtab-settings-section:first-of-type {
    margin-top: 0;
}

.newtab-settings-section-title {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
}

.newtab-settings-row {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
}

.newtab-settings-row > input {
    min-width: 0;
    flex: 1 1 180px;
    height: 38px;
    box-sizing: border-box;
    padding: 0 11px;
    border: 1px solid rgba(0, 0, 0, 0.13);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.9);
    color: inherit;
    font: inherit;
    outline: none;
}

.newtab-settings-row > input:focus {
    border-color: rgba(24, 90, 242, 0.65);
    box-shadow: 0 0 0 3px rgba(24, 90, 242, 0.1);
}

@media (prefers-color-scheme: dark) {
    .newtab-settings-row > input {
        border-color: rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.22);
    }
}

.newtab-settings-links {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
}

.newtab-settings-action,
.newtab-settings-choice,
.newtab-settings-danger,
.newtab-settings-link {
    flex: 0 0 auto;
    min-height: 38px;
    box-sizing: border-box;
    border: 0;
    border-radius: 10px;
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.068);
    color: #000000;
    font: inherit;
    font-size: 14px;
    line-height: 1.25;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, transform 0.12s ease;
}

.newtab-settings-action:hover,
.newtab-settings-choice:hover,
.newtab-settings-danger:hover,
.newtab-settings-link:hover {
    background: rgba(0, 0, 0, 0.17);
}

.newtab-settings-action:active,
.newtab-settings-choice:active,
.newtab-settings-danger:active,
.newtab-settings-link:active {
    transform: scale(0.97);
}

.newtab-settings-choice[aria-pressed="true"] {
    background: rgb(0, 255, 123);
    color: #000000;
}

.newtab-settings-danger {
    background: rgb(221, 0, 0);
    color: #ffffff;
}

.newtab-settings-danger:hover {
    background: rgb(189, 0, 0);
}

@media (prefers-color-scheme: dark) {
    .newtab-settings-action,
    .newtab-settings-choice,
    .newtab-settings-link {
        background: rgba(0, 0, 0, 0.417);
        color: #ffffff;
    }

}

.newtab-settings-hint {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    color: #777;
}

@media (prefers-color-scheme: dark) {
    .newtab-settings-hint {
        color: #aaa;
    }
}

.newtab-shortcut-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.newtab-shortcut-entry {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    padding: 8px 10px;
    border-radius: 11px;
    background: rgba(0, 0, 0, 0.045);
}

@media (prefers-color-scheme: dark) {
    .newtab-shortcut-entry {
        background: rgba(255, 255, 255, 0.07);
    }
}

.newtab-shortcut-entry-icon {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.7);
}

.newtab-shortcut-entry-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.newtab-shortcut-entry-info {
    min-width: 0;
    flex: 1 1 auto;
}

.newtab-shortcut-entry-name,
.newtab-shortcut-entry-url {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.newtab-shortcut-entry-name {
    font-size: 14px;
}

.newtab-shortcut-entry-url {
    margin-top: 2px;
    font-size: 11px;
    color: #888;
}

.main-shortcuts[data-icon-size="standard"] .main-shortcut-icon {
    width: 52px;
    height: 52px;
}

.main-shortcuts[data-icon-size="large"] .main-shortcut-icon {
    width: 68px;
    height: 68px;
}

.main-shortcuts[data-icon-size="extra-large"] .main-shortcut-icon {
    width: 84px;
    height: 84px;
}

.main-shortcuts[data-label-visible="false"] .main-shortcut-name {
    display: none;
}

.main-shortcut-ad {
    width: min(100%, 728px);
    min-height: 90px;
    margin: 8px auto 4px;
    padding: 4px 0;
    box-sizing: border-box;
    display: block;
    text-align: center;
}

.main-shortcut-ad .adsbygoogle {
    display: block;
    width: 100%;
    min-height: 90px;
}
</style>
</head>

<body>

<div id="clock"></div>

<div class="search">
    <input type="text" id="searchBox" data-i18n-placeholder="searchPlaceholder" placeholder="スクロールして一覧を表示" autocomplete="off" />
    <button class="searchbtn" id="searchButton">

<script>
    const updateClock = () => {
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const clockEl = document.getElementById("clock");
        if (!clockEl) {
            console.error("[Clock] Required element not found: #clock");
            return;
        }

        const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        const dayName = dayNames[now.getDay()];
        clockEl.textContent = `${month}.${day} ${dayName} ${hours}:${minutes}`;
    };
    updateClock();
    setInterval(updateClock, 1000);
</script>
