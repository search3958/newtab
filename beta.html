<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallpaper</title>

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: #fff var(--wallpaper-light, url("bgimg/baram1.webp"))
        center / cover no-repeat fixed;
}

@media (prefers-color-scheme: dark) {
    body {
        background-color: #000;
        background-image: var(--wallpaper-dark, url("bgimg/baram1_dark.webp"));
    }
}
</style>
</head>

<body>

<script>
(() => {
    const DB_NAME = "WallpaperDB";
    const STORE = "images";

    const setWallpaper = (light, dark) => {
        if (!document.body) return;

        const lightUrl = light
            ? URL.createObjectURL(light)
            : "bgimg/baram1.webp";

        const darkUrl = dark
            ? URL.createObjectURL(dark)
            : lightUrl;

        document.body.style.setProperty(
            "--wallpaper-light",
            `url("${lightUrl}")`
        );

        document.body.style.setProperty(
            "--wallpaper-dark",
            `url("${darkUrl}")`
        );
    };

    const get = (db, key) => new Promise(resolve => {
        const request = db
            .transaction(STORE, "readonly")
            .objectStore(STORE)
            .get(key);

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => resolve(null);
    });

    const init = () => {
        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = e => {
            const db = e.target.result;

            if (!db.objectStoreNames.contains(STORE)) {
                db.createObjectStore(STORE);
            }
        };

        request.onsuccess = async () => {
            const db = request.result;

            try {
                // ランダム壁紙
                const random = await get(db, "newtabRandom");

                if (
                    Array.isArray(random?.wallpapers) &&
                    random.wallpapers.length
                ) {
                    const list = random.wallpapers.filter(
                        x => x?.light || x?.dark
                    );

                    if (list.length) {
                        const wallpaper =
                            list[Math.floor(Math.random() * list.length)];

                        setWallpaper(
                            wallpaper.light || wallpaper.dark,
                            wallpaper.dark || wallpaper.light
                        );

                        return;
                    }
                }

                // 通常壁紙
                const normal = await get(db, "newtab");

                if (normal?.light || normal?.dark) {
                    setWallpaper(
                        normal.light || normal.dark,
                        normal.dark || normal.light
                    );

                    return;
                }

                // Light / Dark 個別壁紙
                const light = await get(db, "light");
                const dark = await get(db, "dark");

                if (light?.light || dark?.dark) {
                    setWallpaper(
                        light?.light || dark?.dark,
                        dark?.dark || light?.light
                    );
                }
            } catch (error) {
                console.error("[Wallpaper] Load failed:", error);
            }

            db.close();
        };

        request.onerror = () => {
            console.error("[Wallpaper] IndexedDB open failed:", request.error);
        };
    };

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init, { once: true });
    } else {
        init();
    }
})();
</script>

</body>
</html>
