<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apkil 7</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: #fff var(--wallpaper-light, url("bgimg/baram1.webp"))
        center / cover no-repeat fixed;
    font-family:
        "IBM Plex Sans JP",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    padding: 0;
    margin: 0;
    transition: background-image 0.3s ease;
    background-attachment: fixed;
    background-size: cover;
    background-position: center;
    overflow-x: hidden;
}

@media (prefers-color-scheme: dark) {
    body {
        background-color: #000;
        background-image: var(--wallpaper-dark, url("bgimg/baram1_dark.webp"));
    }
}

/* ================================
    Layout
    ================================ */

/* ================================
    Clock
    ================================ */

#clock {
    position: fixed;
    top: 35px;
    right: 40px;
    color: rgba(0, 0, 0, 0.5);
    z-index: 100;
    font-size: 18px;
}

@media (prefers-color-scheme: dark) {
    #clock {
        color: rgba(255, 255, 255, 0.5);
    }
}

/* ================================
   Search Bar (v2.1 style)
   ================================ */

.search {
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 413px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 27px;
    padding: 3px;
    backdrop-filter: blur(24px);
    z-index: 100;
    position: fixed;
}

@media (prefers-color-scheme: dark) {
    .search {
        background: rgba(28, 28, 28, 0.5);
    }
}

#searchBox {
    margin: 0;
    width: 344px;
    height: 48px;
    font-size: 32px;
    padding-left: 16px;
    border: none;
    background: none;
    outline: none;
    border-radius: 100px;
    font-family: inherit;
}

@media (prefers-color-scheme: dark) {
    #searchBox {
        color: #fff;
    }
}

.searchbtn {
    margin: 0;
    width: 39px;
    height: 50px;
    border: none;
    background: none;
    text-align: right;
    transform: scale(1.2);
    color: #185af2;
    border-radius: 100px;
    cursor: pointer;
    font-family: inherit;
}

/* ================================
   History (v2.1 style)
   ================================ */

.history-list {
    position: fixed;
    top: 140px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 4px;
    z-index: 100;
    max-width: 500px;
}

.history {
    position: relative;
    margin: 4px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.5);
    color: #000;
    border-radius: 16px;
    backdrop-filter: blur(16px);
    height: 24px;
    font-size: 14px;
    cursor: pointer;
}

@media (prefers-color-scheme: dark) {
    .history {
        background: rgba(28, 28, 28, 0.5);
        color: #fff;
    }
}

.app-search-buttons {
    position: fixed;
    top: 170px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 100;
}

.search-btn {
    margin: 4px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.5);
    color: #000;
    border-radius: 16px;
    backdrop-filter: blur(16px);
    height: 40px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
}

.search-btn--app {
    background: rgba(24, 90, 242, 0.5);
    color: #fff;
}

@media (prefers-color-scheme: dark) {
    .search-btn {
        background: rgba(28, 28, 28, 0.5);
        color: #fff;
    }
    .search-btn--app {
        background: rgba(24, 90, 242, 0.7);
        color: #fff;
    }
}

.search-btn:hover {
    background: rgba(24, 90, 242, 0.8);
}

.search-btn--history:hover {
    background: rgba(255, 255, 255, 0.7);
}

@media (prefers-color-scheme: dark) {
    .search-btn--history:hover {
        background: rgba(255, 255, 255, 0.2);
    }
}

.search-btn--app:hover {
    background: rgba(24, 90, 242, 0.9);
}

/* ================================
    App Search Dropdown
    ================================ */

.app-search-dropdown {
    position: fixed;
    top: 130px;
    left: 50%;
    transform: translateX(-50%);
    width: 413px;
    max-height: 300px;
    overflow-y: auto;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 16px;
    backdrop-filter: blur(24px);
    z-index: 150;
    padding: 8px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    display: none;
}

@media (prefers-color-scheme: dark) {
    .app-search-dropdown {
        background: rgba(28, 28, 28, 0.95);
    }
}

.app-search-dropdown.visible {
    display: block;
}

.app-search-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
}

.app-search-item:hover {
    background: rgba(24, 90, 242, 0.1);
}

@media (prefers-color-scheme: dark) {
    .app-search-item:hover {
        background: rgba(24, 90, 242, 0.2);
    }
}

.app-search-item-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.app-search-item-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.app-search-item-name {
    font-size: 14px;
    color: #000;
}

@media (prefers-color-scheme: dark) {
    .app-search-item-name {
        color: #fff;
    }
}

.app-search-item-url {
    font-size: 11px;
    color: #999;
    margin-left: auto;
    white-space: nowrap;
}

/* ================================
    Intelligence Box
    ================================ */

.intelligence-box {
    position: fixed;
    top: 130px;
    left: 50%;
    transform: translateX(-50%);
    width: 413px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 16px;
    backdrop-filter: blur(24px);
    z-index: 150;
    padding: 8px 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.3s ease, transform 0.3s ease;
    opacity: 0;
    transform: translateX(-50%) translateY(-10px);
    pointer-events: none;
}

@media (prefers-color-scheme: dark) {
    .intelligence-box {
        background: rgba(28, 28, 28, 0.95);
    }
}

.intelligence-box.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
}

.intelligence-answer {
    font-size: 16px;
    color: #000;
    text-align: center;
    width: 100%;
    cursor: pointer;
}

@media (prefers-color-scheme: dark) {
    .intelligence-answer {
        color: #fff;
    }
}

.intelligence-answer.hide {
    color: #0059ff;
    filter: blur(4px);
    opacity: 0;
}

/* ================================
   Shortcut Section (scrolls into view)
   ================================ */

.shortcut {
    position: relative;
    top: 100vh;
    background: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(32px);
    padding-top: 8px;
    min-height: 100vh;
    width: 100%;
}

@media (prefers-color-scheme: dark) {
    .shortcut {
        background: rgba(0, 0, 0, 0.3);
    }
}

.main-shortcuts {
    box-sizing: border-box;
    padding: 32px;
}

.main-shortcuts-list {
    display: flex;
    flex-direction: column;
    gap: 28px;
    max-width: 1100px;
    margin: 0 auto;
}

.main-shortcut-category {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.main-shortcut-title {
    margin: 0;
    font-size: 20px;
    text-align: center;
    font-weight:400;
    color: rgba(0, 0, 0, 0.88);
    text-shadow: 0 1px 5px rgba(255, 255, 255, 0.55);
    margin-top:16px;
    opacity:0.5;
}

@media (prefers-color-scheme: dark) {
    .main-shortcut-title {
        color: rgba(255, 255, 255, 0.92);
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.65);
    }
}

.main-shortcut-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 1px;
}

/* ================================
    Shortcut Items (v2.1 style)
   ================================ */

.main-shortcut-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    min-width: 0;
    color: inherit;
    text-decoration: none;
    perspective: 800px;
}

.main-shortcut-box {
    border-radius: 40px;
    background-color: rgba(255, 255, 255, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease-out;
    transform: rotateX(0deg) rotateY(0deg);
    overflow: hidden;
}

@media (prefers-color-scheme: dark) {
    .main-shortcut-box {
        background-color: rgba(17, 17, 17, 0.7);
    }
}

.main-shortcut-icon {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
}

.main-shortcut-icon img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    scale:0.9;
}

.main-shortcut-name {
    width: 70px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
    font-size: 12px;
    line-height: 1.3;
    color: rgba(0, 0, 0, 0.88);
    text-shadow: 0 1px 5px rgba(255, 255, 255, 0.65);
}

@media (prefers-color-scheme: dark) {
    .main-shortcut-name {
        color: rgba(255, 255, 255, 0.92);
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.65);
    }
}

.main-shortcut-box {
    transition: transform 0.2s ease-out;
}

.main-shortcut-item:hover .main-shortcut-box {
    transform: rotateX(0deg) rotateY(0deg);
}

/* ================================
    History Dialog
    ================================ */

#historyDialog {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.4);
    z-index: 200;
    display: flex;
    justify-content: center;
    align-items: center;
}

#historyDialog .dialog-content {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    max-width: 400px;
    width: 90%;
    max-height: 70vh;
    overflow: auto;
    position: relative;
}

#historyDialog .dialog-content button {
    position: absolute;
    top: 8px;
    right: 8px;
    border: none;
    background: none;
    font-size: 24px;
    cursor: pointer;
    padding: 0 4px;
}

#historyDialog .dialog-content h3 {
    margin: 0;
    font-size: 18px;
}

#historyDialog .dialog-content ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

#historyDialog .dialog-content li {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
}

#historyDialog .dialog-content li:hover {
    background: #f5f5f5;
}

#historyDialog .dialog-content .dialog-empty {
    text-align: center;
    color: #999;
}

#historyDialog .dialog-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

#historyDialog button {
    border: none;
    background: none;
    font-size: 24px;
    cursor: pointer;
    padding: 0 4px;
}
</style>
</head>

<body>

<div id="clock"></div>

<div class="search">
    <input type="text" id="searchBox" placeholder="" autocomplete="off" />
    <button class="searchbtn" id="searchButton">
        <span>search</span>
    </button>
</div>

<div class="intelligence-box" id="intelBox">
    <div class="intelligence-answer hide" id="intelAnswer"></div>
</div>

<div class="history-list" id="historyList"></div>
<div class="app-search-buttons">
    <button class="search-btn search-btn--history" id="clearHistory">履歴表示</button>
    <button class="search-btn search-btn--app" id="appSearchBtn">アプリ内検索</button>
</div>
<div class="app-search-dropdown" id="appSearchDropdown"></div>

<div class="shortcut">
    <div class="main-shortcuts" id="mainShortcuts"></div>
</div>

<script src="beta.js"></script>
<script>
    const updateClock = () => {
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        const dayName = days[now.getDay()];
        const clockEl = document.getElementById("clock");
        if (clockEl) clockEl.textContent = `${month}.${day} ${dayName} ${hours}:${minutes}`;
    };
    updateClock();
    setInterval(updateClock, 1000);
</script>

</body>
</html>
