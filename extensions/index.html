<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拡張機能 | SaeTab</title>
  <meta name="description" content="SaeTab 7 に機能を足す拡張機能と、見た目を変えるテーマを選べます。">
  <meta name="theme-color" content="#f9f9ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="top-bar">
    <a class="icon-btn m3-state" href="../" aria-label="SaeTab に戻る" title="SaeTab に戻る"><span class="msr">arrow_back</span></a>
    <span class="top-bar-label">SaeTab</span>
  </header>

  <main class="page">
    <h1 class="headline">拡張機能</h1>
    <p class="lead">SaeTab に機能を足したり、見た目を変えたりできます。追加・削除は、SaeTab を開き直すと反映されます。</p>

    <div class="segmented" role="tablist" aria-label="種類">
      <button class="segment m3-state" role="tab" id="tab-extensions" aria-controls="panel-extensions" aria-selected="true" data-tab="extensions">
        <span class="msr">extension</span>拡張機能
      </button>
      <button class="segment m3-state" role="tab" id="tab-themes" aria-controls="panel-themes" aria-selected="false" data-tab="themes">
        <span class="msr">palette</span>テーマ
      </button>
    </div>

    <section class="panel" id="panel-extensions" role="tabpanel" aria-labelledby="tab-extensions">
      <h2 class="title">おすすめ</h2>
      <div class="list" id="extensionCatalog"></div>

      <h2 class="title">入っている拡張機能</h2>
      <div class="list" id="installedList"></div>

      <details class="card custom">
        <summary class="custom-summary m3-state">
          <span class="card-icon"><span class="msr">code</span></span>
          <span class="custom-summary-text">
            <span class="card-name">自分で追加</span>
            <span class="card-desc">CSS や JavaScript を書いて、自分だけの拡張機能を追加します。</span>
          </span>
          <span class="msr custom-chevron">expand_more</span>
        </summary>
        <form class="custom-form" id="customForm">
          <label class="field">
            <span class="field-label">名前</span>
            <input id="customName" type="text" maxlength="40" required placeholder="例: 時計を大きく">
          </label>
          <label class="field">
            <span class="field-label">CSS</span>
            <textarea id="customCss" rows="4" spellcheck="false" placeholder="#clock { font-size: 72px; }"></textarea>
          </label>
          <label class="field">
            <span class="field-label">JavaScript</span>
            <textarea id="customJs" rows="4" spellcheck="false" placeholder="NT.log(&quot;こんにちは&quot;);"></textarea>
          </label>
          <p class="warn"><span class="msr">warning</span>拡張機能は SaeTab と同じ権限で動きます。信頼できるコードだけを追加してください。</p>
          <div class="actions">
            <button class="btn btn-filled m3-state" type="submit"><span class="msr">add</span>追加</button>
          </div>
        </form>
      </details>
    </section>

    <section class="panel" id="panel-themes" role="tabpanel" aria-labelledby="tab-themes" hidden>
      <p class="hint">テーマは1つだけ使えます。別のテーマを選ぶと入れかわります。</p>
      <div class="theme-grid" id="themeGrid"></div>
    </section>
  </main>

  <div class="dialog-scrim" id="confirmDialog" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
      <span class="msr dialog-icon">delete</span>
      <h2 class="dialog-title" id="confirmTitle"></h2>
      <p class="dialog-text" id="confirmText"></p>
      <div class="dialog-actions">
        <button class="text-btn m3-state" type="button" data-answer="no">キャンセル</button>
        <button class="text-btn m3-state" type="button" data-answer="yes">削除</button>
      </div>
    </div>
  </div>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite" hidden>
    <span id="snackbarText"></span>
    <a class="snackbar-action" href="../">SaeTab を開く</a>
  </div>

  <script src="./catalog.js"></script>
  <script src="./app.js"></script>
</body>
</html>
